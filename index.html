<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>


    <!-- Main Application -->
    <main class="app">

        <!-- Header -->
        <header class="header">

            <div>
                <p class="eyebrow">PERSONAL PRODUCTIVITY</p>

                <h1>
                    Task<span>Flow</span>
                </h1>

                <p class="tagline">
                    Plan it. Track it. Complete it.
                </p>
            </div>

            <div class="today">
                <span id="dayName">TODAY</span>
                <strong id="dateDisplay">--</strong>
            </div>

        </header>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat">
                <span>TOTAL TASKS</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat">
                <span>ACTIVE</span>
                <strong id="activeCount">0</strong>
            </div>

            <div class="stat">
                <span>COMPLETED</span>
                <strong id="completedCount">0</strong>
            </div>

        </section>


        <!-- Add Task -->
        <section class="card add-section">

            <div class="title-row">
                <div class="number">01</div>

                <div>
                    <h2>Add a Task</h2>
                    <p>Create a task and organize your day.</p>
                </div>
            </div>


            <form id="taskForm">

                <div class="main-input">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What do you need to do?"
                        autocomplete="off"
                        maxlength="100"
                        required
                    >

                    <button type="submit">
                        ADD TASK
                    </button>

                </div>


                <div class="options">

                    <div class="field">

                        <label for="taskDate">
                            DATE
                        </label>

                        <input
                            type="date"
                            id="taskDate"
                        >

                    </div>


                    <div class="field">

                        <label for="taskTime">
                            TIME
                        </label>

                        <input
                            type="time"
                            id="taskTime"
                        >

                    </div>


                    <div class="field">

                        <label for="taskPriority">
                            PRIORITY
                        </label>

                        <select id="taskPriority">

                            <option value="low">
                                Low
                            </option>

                            <option value="medium" selected>
                                Medium
                            </option>

                            <option value="high">
                                High
                            </option>

                        </select>

                    </div>

                </div>

            </form>

        </section>


        <!-- Tasks -->
        <section class="card task-section">

            <div class="task-header">

                <div class="title-row">
                    <div class="number">02</div>

                    <div>
                        <h2>My Tasks</h2>
                        <p id="taskSummary">
                            Your tasks will appear here.
                        </p>
                    </div>
                </div>


                <div class="filters">

                    <button
                        class="filter active"
                        data-filter="all"
                    >
                        ALL
                    </button>

                    <button
                        class="filter"
                        data-filter="active"
                    >
                        ACTIVE
                    </button>

                    <button
                        class="filter"
                        data-filter="completed"
                    >
                        DONE
                    </button>

                </div>

            </div>


            <div id="taskList" class="task-list">

                <div id="emptyState" class="empty">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h3>
                        No tasks yet
                    </h3>

                    <p>
                        Add your first task above.
                    </p>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <span>TaskFlow</span>

            <span>
                HTML • CSS • JAVASCRIPT
            </span>

        </footer>

    </main>


    <!-- Edit Modal -->
    <div id="editModal" class="modal">

        <div class="modal-box">

            <div class="modal-title">

                <h2>Edit Task</h2>

                <button
                    id="closeModal"
                    class="close"
                >
                    ×
                </button>

            </div>


            <label>
                TASK
            </label>

            <input
                type="text"
                id="editTaskInput"
            >


            <div class="edit-grid">

                <div>

                    <label>
                        DATE
                    </label>

                    <input
                        type="date"
                        id="editDate"
                    >

                </div>


                <div>

                    <label>
                        TIME
                    </label>

                    <input
                        type="time"
                        id="editTime"
                    >

                </div>


                <div>

                    <label>
                        PRIORITY
                    </label>

                    <select id="editPriority">

                        <option value="low">
                            Low
                        </option>

                        <option value="medium">
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                    </select>

                </div>

            </div>


            <button
                id="saveEdit"
                class="save-btn"
            >
                SAVE CHANGES
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
